<!doctype html>
<html lang="zh-CN">
<head>
    <link rel="icon" href="./favicon.png" type="image/png" />
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#15101e" />
<title>背包守财奴</title>
<style>
  #boot{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;background:#15101e;color:#f5e6c4;font-family:"PingFang SC","Noto Sans CJK SC",sans-serif}
  #boot[hidden]{display:none}
  .bootCard{width:min(420px,88vw);text-align:center}
  .bootCard h1{margin:0 0 8px;font-size:28px;color:#ffd45c}
  .bootCard p{margin:0 0 14px;color:#b8a88a}
  .bootBar{height:12px;border:2px solid #e8b64c;border-radius:8px;overflow:hidden;background:#0006}
  .bootBar i{display:block;height:100%;width:35%;background:linear-gradient(90deg,#e8b64c,#ffd45c);animation:boot 1.1s ease-in-out infinite}
  @keyframes boot{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
</style>
</head>
<body>
<div id="boot" role="status" aria-live="polite">
  <div class="bootCard">
    <h1>背包守财奴</h1>
    <p>正在打开标题……</p>
    <div class="bootBar" aria-hidden="true"><i></i></div>
  </div>
</div>
<div id="app">
  <header id="hud"></header>
  <nav id="sheetNav" class="sheetNav" aria-label="主入口">
    <button type="button" data-sheet="bag">背包</button>
    <button type="button" data-sheet="trial">寻找套装</button>
  </nav>
  <main id="layout">
    <section id="left">
      <div id="battle"></div>
      <div id="mid"></div>
      <div id="pageBag">
        <div class="prepGrid">
          <div id="equip"></div>
          <div id="bagWrap">
            <div id="bagHead"></div>
            <div id="bagScroll"><div id="bag"></div></div>
            <div id="expand"></div>
          </div>
        </div>
        <div id="tempWrap"><div class="ptitle" id="tempTitle">待整理</div><div id="temp"></div></div>
        <div id="reserveWrap"></div>
      </div>
      <div id="pageTrial" hidden></div>
    </section>
    <aside id="side">
      <div class="subNav" aria-label="次级入口">
        <button type="button" data-sub="plan">方案</button>
        <button type="button" data-sub="report">战报</button>
      </div>
      <div id="planPanel" class="panel" hidden></div>
      <div id="details" class="panel"></div>
      <div id="shop" class="panel"></div>
      <div id="statsPanel" class="panel" hidden></div>
    </aside>
  </main>
  <div id="overlay"></div>
  <div id="cinema" hidden></div>
  <div id="toast"></div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
