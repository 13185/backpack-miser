<!doctype html>
<html lang="zh-CN">
<head>
    <link rel="icon" href="./favicon.png" type="image/png" />
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#15101e" />
<title>背包守财奴</title>
<style>#boot{z-index:80;color:#f5e6c4;background:#15101e;justify-content:center;align-items:center;font-family:PingFang SC,Noto Sans CJK SC,sans-serif;display:flex;position:fixed;inset:0}#boot[hidden]{display:none}.bootCard{text-align:center;width:min(420px,88vw)}.bootCard h1{color:#ffd45c;margin:0 0 8px;font-size:28px}.bootCard p{color:#b8a88a;margin:0 0 14px}.bootBar{background:#0006;border:2px solid #e8b64c;border-radius:8px;height:12px;overflow:hidden}.bootBar i{background:linear-gradient(90deg,#e8b64c,#ffd45c);width:35%;height:100%;animation:1.1s ease-in-out infinite boot;display:block}@keyframes boot{0%{transform:translate(-120%)}to{transform:translate(320%)}}</style>
  <script type="module" crossorigin src="./assets/index-D3nVIOFD.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-DvLPHT4g.css">
</head>
<body>
<div id="boot" role="status" aria-live="polite">
  <div class="bootCard">
    <h1>背包守财奴</h1>
    <p>正在打开标题……</p>
    <div class="bootBar" aria-hidden="true"><i></i></div>
  </div>
</div>
<div id="app">
  <header id="hud"></header>
  <nav id="sheetNav" class="sheetNav" aria-label="主入口">
    <button type="button" data-sheet="bag">背包</button>
    <button type="button" data-sheet="trial">寻找套装</button>
  </nav>
  <main id="layout">
    <section id="left">
      <div id="battle"></div>
      <div id="mid"></div>
      <div id="pageBag">
        <div class="prepGrid">
          <div id="equip"></div>
          <div id="bagWrap">
            <div id="bagHead"></div>
            <div id="bagScroll"><div id="bag"></div></div>
            <div id="expand"></div>
          </div>
        </div>
        <div id="tempWrap"><div class="ptitle" id="tempTitle">待整理</div><div id="temp"></div></div>
        <div id="reserveWrap"></div>
      </div>
      <div id="pageTrial" hidden></div>
    </section>
    <aside id="side">
      <div class="subNav" aria-label="次级入口">
        <button type="button" data-sub="plan">方案</button>
        <button type="button" data-sub="report">战报</button>
      </div>
      <div id="planPanel" class="panel" hidden></div>
      <div id="details" class="panel"></div>
      <div id="shop" class="panel"></div>
      <div id="statsPanel" class="panel" hidden></div>
    </aside>
  </main>
  <div id="overlay"></div>
  <div id="cinema" hidden></div>
  <div id="toast"></div>
</div>
</body>
</html>
